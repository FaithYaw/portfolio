<section id="skills" class="skills">
  <h2 class="section-title" appScrollReveal>Skills & Technologies</h2>

  @for (category of categories; track category.name; let catIndex = $index) {
    <div class="skills__category">
      <h3 class="skills__category-title" appScrollReveal appScrollRevealType="slide-left" [appScrollRevealDelay]="catIndex * 80">{{ category.name }}</h3>
      <div class="skills__grid">
        @for (skill of category.skills; track skill.name; let skillIndex = $index) {
          <div class="skill-card" appScrollReveal appScrollRevealType="zoom-in" [appScrollRevealDelay]="(catIndex * 60) + (skillIndex * 40)">
            {{ skill.name }}
          </div>
        }
      </div>
    </div>
  }
</section>
